<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cindy's Space</title>
    <style>
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #fffaf5 0%, #ffe8d6 100%); 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #5a4b42;
        }
        .container {
            width: 90%;
            max-width: 450px;
            margin: 50px 0;
        }
        .section-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        h2 {
            font-size: 16px;
            color: #d35400;
            margin: 0 0 10px 0;
            border-bottom: 1.5px solid #ffccac;
            display: inline-block;
        }
        p { font-size: 14px; line-height: 1.5; margin: 0; }
        .footer { margin-top: 30px; font-size: 11px; color: #bfa393; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <div class="section-card">
            <h2>關於我</h2>
            <p>歡迎來到 Cindy 的個人空間，在這裡你可以了解到真正的我。</p>
        </div>

        <div class="section-card">
            <h2>興趣愛好</h2>
            <p>熱愛閱讀跟文學創作，喜歡觀察生活中的大小事。</p>
        </div>

        <div class="section-card">
            <h2>我的大小事</h2>
            <p>分享及記錄生活中的點點滴滴。</p>
        </div>

        <div class="section-card">
            <h2>小小程式</h2>
            <p>關於重生後我所製造的程式。</p>
        </div>

        <div class="section-card">
            <h2>口琴世界</h2>
            <p>呼吸的日常。</p>
        </div>

        <div class="footer">© 2026 Cindy</div>
    </div>

</body>
</html>
