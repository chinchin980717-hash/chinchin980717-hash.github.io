<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cindy's FILES</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="hero-section">
        <div class="profile-card">
            <div class="avatar-wrapper">👤</div>
            <div class="typing-box">
                <p class="profile-text">歡迎來到 Cindy 的個人空間，在這裡你可以了解到真正的我。</p>
            </div>
        </div>
    </section>

    <section class="folder-section">
        <div class="container">
            <h2 class="section-title">CINDY'S FILES</h2>
            
            <div class="nav-links">
                <a href="about.html" class="folder-item transition-link">
                    <div class="icon-box"><i class="fas fa-folder"></i></div>
                    <span class="label">關於我</span>
                </a>

                <a href="life.html" class="folder-item transition-link">
                    <div class="icon-box"><i class="fas fa-folder-open"></i></div>
                    <span class="label">分享及記錄生活……之類的</span>
                </a>

                <a href="code.html" class="folder-item transition-link">
                    <div class="icon-box"><i class="fas fa-code"></i></div>
                    <span class="label">關於重生後我所製造的程式</span>
                </a>

                <a href="harmonica.html" class="folder-item transition-link">
                    <div class="icon-box"><i class="fas fa-music"></i></div>
                    <span class="label">呼吸的日常</span>
                </a>
            </div>
        </div>
    </section>

    <div class="footer">© 2026 Cindy. Minimal Space.</div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const links = document.querySelectorAll('.transition-link');
            links.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    document.body.classList.add('fade-out');
                    setTimeout(() => { window.location.href = link.getAttribute('href'); }, 500);
                });
            });
        });
    </script>
</body>
</html>
