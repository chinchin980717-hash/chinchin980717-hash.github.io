<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cindy | Portfolio</title>
    <style>
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); /* 輕柔的漸層背景 */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #2d3436;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 600px;
            margin: 40px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h1 { font-size: 28px; margin: 10px 0; letter-spacing: 2px; }
        .tagline { color: #636e72; font-size: 16px; margin-bottom: 30px; }
        
        .nav-links { display: flex; flex-direction: column; gap: 15px; }
        .link-btn {
            background: white;
            padding: 16px;
            border-radius: 12px;
            text-decoration: none;
            color: #2d3436;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .link-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-color: #3498db;
            color: #3498db;
        }
        .section-title {
            text-align: left;
            font-size: 14px;
            color: #b2bec3;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 25px 0 10px 5px;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <div style="font-size: 80px;">✨</div>
        <h1>Cindy Chen</h1>
        <p class="tagline">彰化女中 | 物理研究與機器人開發</p>

        <div class="section-title">關於我</div>
        <div class="nav-links">
            <a href="#" class="link-btn">📖 我的學習歷程</a>
            <a href="#" class="link-btn">🤖 機器人專案紀錄</a>
            <a href="#" class="link-btn">🎶 半音階口琴練習</a>
        </div>

        <div class="section-title">聯絡方式</div>
        <div class="nav-links">
            <a href="mailto:你的信箱@gmail.com" class="link-btn">✉️ Email Me</a>
        </div>
    </div>

    <footer style="color: #636e72; font-size: 12px; margin-bottom: 20px;">
        © 2026 Cindy. All rights reserved.
    </footer>

</body>
</html>
