<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Cindy - 玩家檔案</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #fdfaf5;
            --paper-color: #ffffff;
            --text-main: #4a3f35;
            --accent-brown: #c9a991;
            --shadow: rgba(74, 63, 53, 0.08);
        }

        /* 📜 畫布背景：增加間距感 */
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            margin: 0;
            background: var(--bg-color);
            background-image: radial-gradient(#e5e0d8 1.2px, transparent 1.2px);
            background-size: 30px 30px; /* 背景點點也拉開一點 */
            color: var(--text-main);
            line-height: 1.8; /* 增加行高，閱讀更舒適 */
            overflow-x: hidden;
        }

        /* 🎨 柔和過場遮罩 */
        body::before, body::after {
            content: "";
            position: fixed;
            left: 0; width: 100%; height: 120px;
            z-index: 10;
            pointer-events: none;
        }
        body::before {
            top: 0;
            background: linear-gradient(to bottom, var(--bg-color) 40%, transparent);
        }
        body::after {
            bottom: 0;
            background: linear-gradient(to top, var(--bg-color) 40%, transparent);
        }

        .container {
            max-width: 550px; /* 稍微加寬，減少擁擠感 */
            margin: 0 auto;
            padding: 150px 25px; /* 增加上下大幅度留白 */
        }

        /* ✨ 玩家檔案卡片：增加內距與呼吸感 */
        .player-profile {
            background: var(--paper-color);
            border-radius: 8px;
            padding: 50px 45px; /* 顯著增加內部留白 */
            box-shadow: 0 25px 70px var(--shadow);
            border: 1px solid rgba(201, 169, 145, 0.15);
            position: relative;
            
            opacity: 0;
            transform: translateY(50px);
            transition: all 1.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .player-profile.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 裝飾線：更輕細 */
        .player-profile::after {
            content: "";
            position: absolute;
            top: 20px; left: 20px; right: 20px; bottom: 20px;
            border: 1px solid rgba(201, 169, 145, 0.08);
            pointer-events: none;
        }

        .profile-header {
            display: flex;
            align-items: center;
            margin-bottom: 40px; /* 拉開標題與內容的距離 */
            border-bottom: 1px solid #f5f2ef;
            padding-bottom: 20px;
        }

        .icon-game {
            font-size: 26px;
            color: var(--accent-brown);
            margin-right: 15px;
        }

        .profile-title {
            font-size: 19px;
            margin: 0;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .id-card {
            background: #faf8f5;
            padding: 25px 30px; /* 增加 ID 卡片內的空間 */
            border-left: 6px solid var(--accent-brown);
            margin-bottom: 45px;
        }

        .id-label {
            font-weight: bold;
            color: var(--accent-brown);
            font-size: 12px;
            letter-spacing: 3px;
            margin-bottom: 10px;
            opacity: 0.8;
        }

        .section-subtitle {
            font-size: 13px;
            color: var(--accent-brown);
            margin: 45px 0 20px;
            display: flex;
            align-items: center;
            letter-spacing: 2px;
            opacity: 0.9;
        }
        .section-subtitle::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, var(--accent-brown), transparent);
            margin-left: 20px;
        }

        .attr-text {
            font-size: 20px;
            font-weight: 500;
            margin: 10px 0;
            letter-spacing: 1px;
        }

        .attr-note {
            font-size: 14px;
            color: #8e8276;
            margin-top: 5px;
        }

        .equip-list {
            list-style: none;
            padding: 0;
            margin-top: 10px;
        }

        .equip-list li {
            padding: 20px 5px; /* 增加裝備間的垂直距離 */
            border-bottom: 1px dashed #e8e4df;
            display: flex;
            align-items: center;
            font-size: 15px;
            transition: all 0.4s;
        }
        .equip-list li:hover {
            padding-left: 15px;
            background-color: rgba(253, 250, 245, 0.5);
        }

        .icon-small {
            width: 35px;
            color: var(--accent-brown);
            margin-right: 15px;
            text-align: center;
            font-size: 18px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 60px; /* 讓按鈕離內容遠一點，不要太擠 */
            text-decoration: none;
            color: var(--accent-brown);
            font-size: 13px;
            letter-spacing: 2px;
            border-bottom: 1px solid var(--accent-brown);
            padding-bottom: 5px;
            transition: 0.3s;
            opacity: 0.7;
        }
        .back-btn:hover { opacity: 1; transform: translateX(-8px); }

    </style>
</head>
<body>

    <div class="container">
        <div class="player-profile" id="profileCard">
            <div class="profile-header">
                <i class="fas fa-gamepad icon-game"></i>
                <h3 class="profile-title">玩家檔案：Lv.1 物理魔法師 </h3>
            </div>

            <div class="id-card">
                <div class="id-label">CHARACTER ID</div>
                <div style="font-size: 22px; font-weight: bold; margin-bottom: 8px;">ID: Cindy</div>
                <div style="font-size: 15px; color: #7a6f64;">目前所在地：彰化女中副本</div>
            </div>

            <div class="attributes-section">
                <h4 class="section-subtitle">【 屬性 ATTRIBUTES 】</h4>
                <p class="attr-text">無敵大 I 人</p>
                <p class="attr-note">（社交能量極低，變熟了會變得很瘋）</p>
            </div>

            <div class="equipment-section">
                <h4 class="section-subtitle">【 核心裝備 EQUIPMENT 】</h4>
                <ul class="equip-list">
                    <li><i class="fas fa-music icon-small"></i> 口琴： 隨身攜帶的社交武器</li>
                    <li><i class="fab fa-github icon-small"></i> GitHub： 正在擴建中的數位領地</li>
                    <li><i class="fas fa-bolt icon-small"></i> Arduino： 還不太熟悉的軟硬體法器</li>
                </ul>
            </div>

            <a href="index.html" class="back-btn">← RETURN TO MAIN MENU</a>
        </div>
    </div>

    <script>
        const card = document.getElementById('profileCard');
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    card.classList.add('is-visible');
                }
            });
        }, { threshold: 0.1 });

        observer.observe(card);

        window.addEventListener('load', () => {
            setTimeout(() => {
                card.classList.add('is-visible');
            }, 400);
        });
    </script>
</body>
</html>
