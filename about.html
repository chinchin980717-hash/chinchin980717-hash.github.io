<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Cindy - 玩家檔案</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #fdfaf5;
            --paper-color: #fcf8f0;
            --text-main: #4a3f35;
            --accent-brown: #c9a991;
            --shadow: rgba(74, 63, 53, 0.08);
        }

        /* 📜 讓整個頁面像畫布一樣 */
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            margin: 0;
            background: var(--bg-color);
            /* 加上微弱的紙張紋理感漸層 */
            background-image: radial-gradient(#e5e0d8 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 🎨 頂部與底部的繪畫暈染遮罩 */
        body::before, body::after {
            content: "";
            position: fixed;
            left: 0; width: 100%; height: 80px;
            z-index: 10;
            pointer-events: none;
        }
        body::before {
            top: 0;
            background: linear-gradient(to bottom, var(--bg-color) 20%, transparent);
        }
        body::after {
            bottom: 0;
            background: linear-gradient(to top, var(--bg-color) 20%, transparent);
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 100px 20px; /* 增加上下間距讓滾動感更明顯 */
        }

        /* ✨ 玩家檔案卡片：增加「畫框」感 */
        .player-profile {
            background: var(--card-white);
            background-color: #ffffff;
            border-radius: 2px; /* 方正一點像畫紙 */
            padding: 40px;
            box-shadow: 0 20px 50px var(--shadow);
            border: 1px solid rgba(201, 169, 145, 0.3);
            position: relative;
            
            /* 初始狀態隱藏，準備跑動畫 */
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* 當捲動到位置時觸發 */
        .player-profile.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 裝飾畫角 */
        .player-profile::before {
            content: "";
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 1px solid rgba(201, 169, 145, 0.1);
            pointer-events: none;
        }

        .profile-header {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }

        .icon-game {
            font-size: 24px;
            color: var(--accent-brown);
            margin-right: 12px;
        }

        .profile-title {
            font-size: 18px;
            margin: 0;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .id-card {
            background: #f9f6f2;
            padding: 20px;
            border-left: 4px solid var(--accent-brown);
            margin-bottom: 30px;
        }

        .id-label {
            font-weight: bold;
            color: var(--accent-brown);
            font-size: 13px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .section-subtitle {
            font-size: 13px;
            color: var(--accent-brown);
            margin: 30px 0 15px;
            display: flex;
            align-items: center;
        }
        .section-subtitle::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, var(--accent-brown), transparent);
            margin-left: 10px;
        }

        .attr-text {
            font-size: 18px;
            font-weight: 500;
            margin: 5px 0;
        }

        .attr-note {
            font-size: 13px;
            color: #8e8276;
            font-style: italic;
        }

        .equip-list {
            list-style: none;
            padding: 0;
        }

        .equip-list li {
            padding: 15px 0;
            border-bottom: 1px dashed #e0dcd5;
            display: flex;
            align-items: center;
            font-size: 14px;
        }

        .icon-small {
            width: 30px;
            color: var(--accent-brown);
            margin-right: 10px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 40px;
            text-decoration: none;
            color: var(--accent-brown);
            font-size: 13px;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--accent-brown);
            padding-bottom: 2px;
            transition: 0.3s;
        }
        .back-btn:hover { opacity: 0.7; }

    </style>
</head>
<body>

    <div class="container">
        <div class="player-profile" id="profileCard">
            <div class="profile-header">
                <i class="fas fa-gamepad icon-game"></i>
                <h3 class="profile-title">玩家檔案：Lv.1 物理魔法師</h3>
            </div>

            <div class="id-card">
                <div class="id-label">Identity Card</div>
                <div style="font-size: 18px; font-weight: bold; margin-bottom: 5px;">ID: Cindy</div>
                <div style="font-size: 14px; color: #666;">目前所在地：彰化女中副本</div>
            </div>

            <div class="attributes-section">
                <h4 class="section-subtitle">【 屬性 ATTR 】</h4>
                <p class="attr-text">無敵大 I 人</p>
                <p class="attr-note">社交能量極低，變熟了會變得很瘋</p>
            </div>

            <div class="equipment-section">
                <h4 class="section-subtitle">【 核心裝備 EQUIP 】</h4>
                <ul class="equip-list">
                    <li><i class="fas fa-music icon-small"></i> 口琴： 隨身攜帶的社交武器</li>
                    <li><i class="fab fa-github icon-small"></i> GitHub： 正在擴建中的數位領地</li>
                    <li><i class="fas fa-bolt icon-small"></i> Arduino： 還不太熟悉的軟硬體法器</li>
                </ul>
            </div>

            <a href="index.html" class="back-btn">← RETURN TO MENU</a>
        </div>
    </div>

    <script>
        // ✨ 簡單的捲動偵測腳本
        const card = document.getElementById('profileCard');
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    card.classList.add('is-visible');
                }
            });
        }, { threshold: 0.1 });

        observer.observe(card);

        // 初始化時檢查一次
        window.addEventListener('load', () => {
            card.classList.add('is-visible');
        });
    </script>
</body>
</html>
