<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Cindy | CINDY'S SPACE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #fdfaf5;
            --card-white: #ffffff;
            --text-main: #4a3f35;
            --accent-brown: #c9a991;
            --shadow: rgba(74, 63, 53, 0.05);
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* 導覽列：返回按鈕 */
        .nav-header {
            position: sticky;
            top: 0;
            padding: 20px;
            background-color: rgba(253, 250, 245, 0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            align-items: center;
        }

        .back-btn {
            text-decoration: none;
            color: var(--text-main);
            font-size: 14px;
            display: flex;
            align-items: center;
            transition: color 0.3s;
        }

        .back-btn:hover { color: var(--accent-brown); }
        .back-btn i { margin-right: 8px; }

        /* 主容器 */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 個人簡介區 */
        .profile-section {
            text-align: center;
            margin-bottom: 40px;
        }

        /* 頭像邏輯：與主頁一致，確保不切半 */
        .about-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center;
            border: 4px solid #fff;
            box-shadow: 0 4px 15px var(--shadow);
            margin-bottom: 20px;
        }

        h1 { font-size: 24px; margin-bottom: 10px; color: var(--text-main); }
        .subtitle { color: var(--accent-brown); font-size: 14px; letter-spacing: 2px; margin-bottom: 20px; }

        .bio-card {
            background: var(--card-white);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px var(--shadow);
            text-align: left;
            margin-bottom: 30px;
        }

        /* 興趣標籤區 */
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .tag {
            background: var(--bg-color);
            color: var(--accent-brown);
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 13px;
            border: 1px solid #eee;
        }

        /* 底部聯絡 */
        .contact-footer {
            text-align: center;
            margin-top: 50px;
            padding-bottom: 40px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 20px;
        }

        .social-links a { color: var(--accent-brown); transition: transform 0.3s; }
        .social-links a:hover { transform: scale(1.2); }
        
        .footer-text { font-size: 11px; color: #a3968b; margin-top: 20px; }
    </style>
</head>
<body>

    <nav class="nav-header">
        <a href="index.html#inner" class="back-btn">
            <i class="fas fa-chevron-left"></i> 返回
        </a>
    </nav>

    <div class="container">
        <section class="profile-section">
            <img src="IMG_20260211_080039.jpg" class="about-avatar" alt="Cindy">
            <h1>Cindy</h1>
            <div class="subtitle">HIGH SCHOOL STUDENT | PHYSICS ENTHUSIAST</div>
            
            <div class="bio-card">
                <p>嗨！我是 Cindy。目前是一名高一學生。</p>
                <p>
                    我對這個世界充滿好奇，喜歡透過物理去理解自然的邏輯，也喜歡透過程式去創造屬於自己的小世界。
                    在課餘時間，我會練習半音階口琴，也喜歡觀察自然、種植植物。
                </p>
                
                <div class="tags-container">
                    <span class="tag"># 物理</span>
                    <span class="tag"># 半音階口琴</span>
                    <span class="tag"># 程式開發</span>
                    <span class="tag"># 自然觀察</span>
                </div>
            </div>
        </section>

        <footer class="contact-footer">
            <div class="social-links">
                <a href="https://github.com/" target="_blank"><i class="fab fa-github"></i></a>
                <a href="mailto:your-email@example.com"><i class="fas fa-envelope"></i></a>
            </div>
            <p class="footer-text">© 2026 Cindy. Stay curious.</p>
        </footer>
    </div>

</body>
</html>
