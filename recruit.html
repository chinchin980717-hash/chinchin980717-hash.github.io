<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="戀語解密 Flip! 角色與裝備招募大池" />
  <title>角色與裝備招募｜戀語解密 Flip!</title>
  <link rel="stylesheet" href="game.css?v=0.29.0" />
</head>
<body>
  <div class="petals" aria-hidden="true"></div>
  <main class="app-shell">
    <section class="screen is-active" aria-labelledby="recruit-title">
      <div class="panel recruit-panel">
        <div class="page-brand">FLIP <span>恋</span><small>戀語解密 · SCHOOL HEART</small></div>
        <button class="text-btn back-link" id="back-button" type="button">← 返回上一頁</button>
        <div class="section-heading"><p class="eyebrow">STORY RECRUITMENT / TWO BANNERS</p><h1 id="recruit-title">角色與裝備招募</h1><p id="pool-description">選擇一個大池，使用對應的招募券尋找新的夥伴與裝備。</p></div>
        <div class="recruit-banner-tabs" role="tablist" aria-label="招募大池">
          <button class="recruit-banner-tab active" data-pool="character-banner" type="button"><span>♛</span><strong>角色大池</strong><small>命定之契</small></button>
          <button class="recruit-banner-tab" data-pool="equipment-banner" type="button"><span>✦</span><strong>裝備大池</strong><small>星光信封</small></button>
        </div>
        <div class="recruit-status"><span id="ticket-label">命定之契 <strong id="recruit-tickets">0</strong></span><span>角色券 <strong id="character-ticket-count">0</strong></span><span>裝備券 <strong id="equipment-ticket-count">0</strong></span><span>距離稀有保底 <strong id="recruit-pity">30</strong></span></div>
        <div class="recruit-machine"><div class="recruit-orbit" id="recruit-orbit">♛</div><strong id="machine-title">翻開命定之契</strong><small id="machine-note">角色大池只會招募角色；重複角色會轉換成角色心願碎片。</small></div>
        <div class="recruit-actions"><button class="primary-btn" id="pull-one-btn" type="button">單抽 <span>×1</span></button><button class="primary-btn recruit-ten" id="pull-ten-btn" type="button">十連招募 <span>×10</span></button></div>
        <p class="recruit-pity-note" id="recruit-pity-note">十連招募至少包含 1 件稀有以上物品；連續 29 抽未出現稀有時，下一抽必定稀有。</p>
        <div id="recruit-results" class="recruit-results"><p class="empty-recruit">招募結果會在這裡出現。</p></div>
        <p class="recruit-source-note">角色池與裝備池分開計算保底；卡池資料來源：<code>data/gacha.js</code></p>
      </div>
    </section>
  </main>
  <script src="data/characters.js?v=0.28.5"></script>
  <script src="data/equipment.js"></script>
  <script src="data/gacha.js?v=0.29.0"></script>
  <script src="recruit.js?v=0.29.0"></script>
</body>
</html>
